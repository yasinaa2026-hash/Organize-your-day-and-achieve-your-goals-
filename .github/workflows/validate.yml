name: Validate Waqti

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Confirm app files exist
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s supabase.sql

      - name: Check for whitespace errors
        run: git diff --check
